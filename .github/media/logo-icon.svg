<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#32598f"/>
      <stop offset="1" stop-color="#1b3862"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5a90dc"/>
      <stop offset="0.55" stop-color="#3a6db0"/>
      <stop offset="1" stop-color="#2c568e"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93bcf2"/>
      <stop offset="1" stop-color="#5789cd"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="126%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#060b16" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back panel + tab (bigger, chunkier so it reads like Explorer's folder) -->
    <rect x="116" y="176" width="352" height="168" rx="50" fill="url(#back)"/>
    <rect x="96" y="286" width="832" height="588" rx="78" fill="url(#back)"/>

    <!-- soft fold shadow where the front meets the back -->
    <rect x="96" y="404" width="832" height="34" fill="#0a1830" opacity="0.32"/>

    <!-- front panel: flat rectangle, no perspective taper -->
    <rect x="96" y="416" width="832" height="458" rx="70" fill="url(#front)"/>

    <!-- bright top lip highlight -->
    <path d="M166 416 h692 a70 70 0 0 1 70 70 v2 H96 v-2 a70 70 0 0 1 70 -70 z" fill="url(#lip)"/>

    <!-- faint diagonal sheen -->
    <path d="M140 436 h660 l-150 150 h-360 z" fill="#ffffff" opacity="0.06"/>
  </g>
</svg>
