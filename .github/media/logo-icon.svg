<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#2f5488"/>
      <stop offset="1" stop-color="#1a355f"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#548ad6"/>
      <stop offset="0.55" stop-color="#376aad"/>
      <stop offset="1" stop-color="#2a5289"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bb6ef"/>
      <stop offset="1" stop-color="#5385c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#050912" flood-opacity="0.48"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back panel + tab (the folder back, showing above the front) -->
    <rect x="84" y="230" width="356" height="162" rx="48" fill="url(#back)"/>
    <rect x="72" y="330" width="880" height="492" rx="68" fill="url(#back)"/>

    <!-- soft fold shadow where the front meets the back -->
    <rect x="72" y="440" width="880" height="30" fill="#0a1830" opacity="0.35"/>

    <!-- front panel: flat rectangle (no perspective taper) -->
    <rect x="72" y="452" width="880" height="370" rx="62" fill="url(#front)"/>

    <!-- bright top lip highlight -->
    <path d="M134 452 h756 a62 62 0 0 1 62 62 v2 H72 v-2 a62 62 0 0 1 62 -62 z" fill="url(#lip)"/>

    <!-- faint diagonal sheen -->
    <path d="M110 470 h700 l-150 150 h-400 z" fill="#ffffff" opacity="0.06"/>
  </g>
</svg>
