<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a30"/>
      <stop offset="0.55" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243f6b"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a68a8"/>
      <stop offset="0.5" stop-color="#2b4f83"/>
      <stop offset="1" stop-color="#1c3a63"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8ad0"/>
      <stop offset="1" stop-color="#3d6bab"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- back panel + tab (peeks above and behind the front) -->
  <path d="M244 356 h150 a30 30 0 0 1 24 12 l40 48 h306 a46 46 0 0 1 46 46 v66 H210 V402 a46 46 0 0 1 34 -46 z"
        fill="url(#back)"/>
  <rect x="210" y="470" width="604" height="236" rx="44" fill="url(#back)"/>

  <!-- soft drop shadow under the front -->
  <path d="M196 500 L828 500 L792 726 a26 26 0 0 1 -26 22 H256 a26 26 0 0 1 -26 -22 Z"
        fill="#05070d" opacity="0.45" transform="translate(0 14)"/>

  <!-- front pocket (flares wider at top = open folder) -->
  <path d="M222 500 h580 a22 22 0 0 1 21 27 l-40 200 a30 30 0 0 1 -29 23 H270 a30 30 0 0 1 -29 -23 l-40 -200 a22 22 0 0 1 21 -27 z"
        fill="url(#front)"/>

  <!-- bright top lip highlight -->
  <path d="M222 500 h580 a22 22 0 0 1 21 27 l-2 10 H203 l-2 -10 a22 22 0 0 1 21 -27 z"
        fill="url(#lip)"/>

  <!-- subtle sheen sweeping across the front -->
  <path d="M210 512 h604 l-150 150 h-360 z" fill="#ffffff" opacity="0.05"/>
</svg>
