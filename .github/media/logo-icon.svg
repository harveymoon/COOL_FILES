<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#26456f"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3d6cac"/>
      <stop offset="0.5" stop-color="#2b4f86"/>
      <stop offset="1" stop-color="#1b3a64"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a97dc"/>
      <stop offset="1" stop-color="#3f6db0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#04070f" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back panel + tab (peeks above and behind the front pocket) -->
    <rect x="120" y="300" width="316" height="150" rx="42" fill="url(#back)"/>
    <rect x="110" y="372" width="804" height="410" rx="52" fill="url(#back)"/>

    <!-- front pocket, flared wider at the top (open-folder look) -->
    <path d="M152 430 h720 a28 28 0 0 1 27 34 l-52 300 a36 36 0 0 1 -35 28 H212 a36 36 0 0 1 -35 -28 l-52 -300 a28 28 0 0 1 27 -34 z"
          fill="url(#front)"/>

    <!-- bright top lip highlight -->
    <path d="M152 430 h720 a28 28 0 0 1 27 34 l-3 16 H128 l-3 -16 a28 28 0 0 1 27 -34 z"
          fill="url(#lip)"/>

    <!-- faint sheen across the front -->
    <path d="M150 452 h724 l-150 150 h-440 z" fill="#ffffff" opacity="0.055"/>
  </g>
</svg>
